<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 0 640 260" role="img" aria-labelledby="title">
  <title id="title">Clamshell luggable field programming unit with hinged display lid, EPROM socket, and keyboard deck</title>
  <g aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper open clamshell lid (x=120..520, y=16..148) -->
    <rect x="120" y="16" width="400" height="132" rx="6" stroke-width="2.5" />
    <!-- Top latches -->
    <rect x="176" y="10" width="28" height="6" rx="1" stroke-width="1.75" />
    <rect x="436" y="10" width="28" height="6" rx="1" stroke-width="1.75" />

    <!-- Recessed flat-panel / plasma display inside lid (x=140..396, y=30..134) -->
    <rect x="140" y="30" width="256" height="104" rx="3" stroke-width="2" />
    <rect x="148" y="38" width="240" height="88" rx="2" stroke-width="1.5" />
    <!-- Ladder rung graphics inside screen -->
    <g stroke-width="1.5" opacity="0.75">
      <line x1="160" y1="48" x2="160" y2="116" />
      <line x1="376" y1="48" x2="376" y2="116" />
      <line x1="160" y1="66" x2="196" y2="66" />
      <line x1="196" y1="58" x2="196" y2="74" />
      <line x1="206" y1="58" x2="206" y2="74" />
      <line x1="206" y1="66" x2="252" y2="66" />
      <line x1="252" y1="58" x2="252" y2="74" />
      <line x1="262" y1="58" x2="262" y2="74" />
      <line x1="262" y1="66" x2="344" y2="66" />
      <circle cx="352" cy="66" r="6" />
      <line x1="358" y1="66" x2="376" y2="66" />

      <line x1="160" y1="98" x2="210" y2="98" />
      <rect x="210" y="86" width="48" height="24" rx="1" />
      <line x1="258" y1="98" x2="344" y2="98" />
      <circle cx="352" cy="98" r="6" />
      <line x1="358" y1="98" x2="376" y2="98" />
    </g>

    <!-- Right-side lid bay: ZIF EPROM programmer socket and drive slot (x=412..502, y=30..134) -->
    <rect x="412" y="30" width="90" height="56" rx="2" stroke-width="1.75" />
    <!-- ZIF socket dual pin rows and locking lever -->
    <rect x="430" y="38" width="36" height="40" rx="1" stroke-width="1.5" />
    <line x1="442" y1="42" x2="442" y2="74" stroke-width="1.5" opacity="0.65" />
    <line x1="454" y1="42" x2="454" y2="74" stroke-width="1.5" opacity="0.65" />
    <line x1="466" y1="46" x2="484" y2="38" stroke-width="2" />
    <circle cx="486" cy="37" r="3" stroke-width="1.5" />
    <!-- Floppy / memory cartridge bay -->
    <rect x="412" y="94" width="90" height="40" rx="2" stroke-width="1.75" />
    <rect x="422" y="108" width="70" height="8" rx="1" stroke-width="1.5" />
    <rect x="466" y="120" width="18" height="6" rx="1" stroke-width="1.25" />

    <!-- Heavy clamshell barrel hinges -->
    <rect x="160" y="148" width="44" height="10" rx="2" stroke-width="2" />
    <rect x="436" y="148" width="44" height="10" rx="2" stroke-width="2" />

    <!-- Lower sloped keyboard case deck (trapezoid perspective, y=158..236) -->
    <polygon points="116,158 524,158 552,224 88,224" stroke-width="2.5" />
    <rect x="88" y="224" width="464" height="14" rx="3" stroke-width="2.5" />
    <!-- Carrying handle at front center -->
    <path d="M268,238 L268,248 L372,248 L372,238" stroke-width="2.5" />

    <!-- Keyboard key rows inside sloped deck -->
    <polygon points="132,166 508,166 526,214 114,214" stroke-width="1.75" />
    <g stroke-width="1.25" opacity="0.75">
      <line x1="128" y1="176" x2="512" y2="176" />
      <line x1="124" y1="188" x2="516" y2="188" />
      <line x1="120" y1="200" x2="520" y2="200" />
      <!-- Vertical key column dividers -->
      <line x1="164" y1="166" x2="152" y2="214" />
      <line x1="200" y1="166" x2="190" y2="214" />
      <line x1="236" y1="166" x2="230" y2="200" />
      <line x1="272" y1="166" x2="268" y2="200" />
      <line x1="308" y1="166" x2="306" y2="200" />
      <line x1="344" y1="166" x2="346" y2="200" />
      <line x1="380" y1="166" x2="384" y2="200" />
      <line x1="416" y1="166" x2="424" y2="214" />
      <line x1="452" y1="166" x2="462" y2="214" />
      <line x1="484" y1="166" x2="496" y2="214" />
    </g>
  </g>
</svg>
