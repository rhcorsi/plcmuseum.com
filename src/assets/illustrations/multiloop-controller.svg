<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 0 640 260" role="img" aria-labelledby="title">
  <title id="title">Panel-mount multiloop PID process controller showing front bargraph faceplate and deep rear instrument housing</title>
  <g aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left view: Flush DIN panel-mount front bezel (x=116..292, y=18..242) -->
    <rect x="116" y="18" width="176" height="224" rx="4" stroke-width="2.5" />
    <rect x="126" y="28" width="156" height="204" rx="2" stroke-width="1.75" />

    <!-- Dual vertical bargraph meters (PV and SP/MV) on left of faceplate -->
    <rect x="138" y="40" width="22" height="124" rx="1" stroke-width="1.75" />
    <rect x="170" y="40" width="22" height="124" rx="1" stroke-width="1.75" />
    <!-- Bargraph level fills (hatched/segmented lines) and scale ticks -->
    <g stroke-width="1.5" opacity="0.8">
      <line x1="142" y1="84" x2="156" y2="84" />
      <line x1="142" y1="92" x2="156" y2="92" />
      <line x1="142" y1="100" x2="156" y2="100" />
      <line x1="142" y1="108" x2="156" y2="108" />
      <line x1="142" y1="116" x2="156" y2="116" />
      <line x1="142" y1="124" x2="156" y2="124" />
      <line x1="142" y1="132" x2="156" y2="132" />
      <line x1="142" y1="140" x2="156" y2="140" />
      <line x1="142" y1="148" x2="156" y2="148" />
      <line x1="142" y1="156" x2="156" y2="156" />

      <line x1="174" y1="92" x2="188" y2="92" />
      <line x1="174" y1="100" x2="188" y2="100" />
      <line x1="174" y1="108" x2="188" y2="108" />
      <line x1="174" y1="116" x2="188" y2="116" />
      <line x1="174" y1="124" x2="188" y2="124" />
      <line x1="174" y1="132" x2="188" y2="132" />
      <line x1="174" y1="140" x2="188" y2="140" />
      <line x1="174" y1="148" x2="188" y2="148" />
      <line x1="174" y1="156" x2="188" y2="156" />
      <!-- Setpoint pointer triangle between bargraphs -->
      <polygon points="162,84 168,80 168,88" />
    </g>

    <!-- Digital PV / SV / MV numeric readout windows on right of faceplate -->
    <rect x="204" y="40" width="66" height="28" rx="2" stroke-width="1.75" />
    <rect x="204" y="76" width="66" height="28" rx="2" stroke-width="1.75" />
    <rect x="204" y="112" width="66" height="24" rx="2" stroke-width="1.5" />
    <!-- Loop status indicator dots -->
    <circle cx="212" cy="150" r="3.5" stroke-width="1.5" />
    <circle cx="226" cy="150" r="3.5" stroke-width="1.5" />
    <circle cx="240" cy="150" r="3.5" stroke-width="1.5" />
    <circle cx="254" cy="150" r="3.5" stroke-width="1.5" />

    <!-- Operator pushbuttons: A/M, CAS, LOOP, UP, DOWN -->
    <g stroke-width="1.75">
      <rect x="138" y="176" width="36" height="22" rx="2" />
      <rect x="182" y="176" width="36" height="22" rx="2" />
      <rect x="226" y="176" width="44" height="22" rx="2" />
      <rect x="138" y="204" width="60" height="20" rx="2" />
      <rect x="210" y="204" width="60" height="20" rx="2" />
    </g>
    <!-- Up/Down chevrons on tuning keys -->
    <polyline points="162,217 168,210 174,217" stroke-width="1.5" />
    <polyline points="234,210 240,217 246,210" stroke-width="1.5" />

    <!-- Right view: Side profile showing panel cutout line and deep rear instrument case (x=332..528) -->
    <!-- Panel cutout dashed vertical reference line -->
    <line x1="348" y1="12" x2="348" y2="248" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <!-- Front bezel lip in side profile -->
    <rect x="332" y="18" width="16" height="224" rx="2" stroke-width="2.5" />
    <!-- Deep sheet-metal instrument housing behind panel -->
    <rect x="348" y="30" width="160" height="200" rx="2" stroke-width="2.25" />
    <!-- Top and bottom slide-in panel mounting brackets -->
    <polygon points="348,26 404,26 412,30 348,30" stroke-width="1.75" />
    <polygon points="348,234 404,234 412,230 348,230" stroke-width="1.75" />
    <!-- Cooling slots on side of instrument case -->
    <g stroke-width="1.5" opacity="0.65">
      <line x1="372" y1="48" x2="480" y2="48" />
      <line x1="372" y1="58" x2="480" y2="58" />
      <line x1="372" y1="68" x2="480" y2="68" />
      <line x1="372" y1="192" x2="480" y2="192" />
      <line x1="372" y1="202" x2="480" y2="202" />
      <line x1="372" y1="212" x2="480" y2="212" />
    </g>
    <!-- Rear multi-tier screw terminal block strip (x=508..526) -->
    <rect x="508" y="42" width="18" height="176" rx="1" stroke-width="2" />
    <g stroke-width="1.5" opacity="0.8">
      <line x1="508" y1="60" x2="526" y2="60" />
      <line x1="508" y1="78" x2="526" y2="78" />
      <line x1="508" y1="96" x2="526" y2="96" />
      <line x1="508" y1="114" x2="526" y2="114" />
      <line x1="508" y1="132" x2="526" y2="132" />
      <line x1="508" y1="150" x2="526" y2="150" />
      <line x1="508" y1="168" x2="526" y2="168" />
      <line x1="508" y1="186" x2="526" y2="186" />
      <line x1="508" y1="204" x2="526" y2="204" />
    </g>
  </g>
</svg>
