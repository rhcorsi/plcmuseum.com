<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 0 640 260" role="img" aria-labelledby="title">
  <title id="title">Distributed remote I/O DIN-rail drop with fieldbus coupler head and high-density slice I/O modules</title>
  <g aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- 35mm DIN rail across full width -->
    <line x1="20" y1="112" x2="56" y2="112" stroke-width="2" opacity="0.6" />
    <line x1="20" y1="148" x2="56" y2="148" stroke-width="2" opacity="0.6" />
    <line x1="584" y1="112" x2="620" y2="112" stroke-width="2" opacity="0.6" />
    <line x1="584" y1="148" x2="620" y2="148" stroke-width="2" opacity="0.6" />

    <!-- Left Fieldbus / Remote I/O Network Coupler Head Module (x=56..176, y=38..222) -->
    <rect x="56" y="38" width="120" height="184" rx="4" stroke-width="2.5" />
    <!-- Node address rotary switches (x10, x1) -->
    <circle cx="82" cy="64" r="12" stroke-width="1.75" />
    <line x1="76" y1="64" x2="88" y2="64" stroke-width="1.75" />
    <circle cx="114" cy="64" r="12" stroke-width="1.75" />
    <line x1="114" y1="58" x2="114" y2="70" stroke-width="1.75" />
    <!-- Coupler status LED bank -->
    <circle cx="146" cy="54" r="3" stroke-width="1.5" />
    <circle cx="160" cy="54" r="3" stroke-width="1.5" />
    <circle cx="146" cy="66" r="3" stroke-width="1.5" />
    <circle cx="160" cy="66" r="3" stroke-width="1.5" />
    <circle cx="146" cy="78" r="3" stroke-width="1.5" />
    <circle cx="160" cy="78" r="3" stroke-width="1.5" />

    <!-- Pluggable fieldbus / twinax network connectors (Port 1 and Port 2) -->
    <rect x="70" y="92" width="44" height="72" rx="2" stroke-width="2" />
    <rect x="78" y="100" width="28" height="24" rx="1" stroke-width="1.5" />
    <rect x="78" y="132" width="28" height="24" rx="1" stroke-width="1.5" />
    <!-- System and field power input terminal block on coupler -->
    <rect x="124" y="92" width="38" height="114" rx="2" stroke-width="1.75" />
    <g stroke-width="1.25" opacity="0.75">
      <circle cx="143" cy="108" r="5" />
      <circle cx="143" cy="126" r="5" />
      <circle cx="143" cy="144" r="5" />
      <circle cx="143" cy="162" r="5" />
      <circle cx="143" cy="180" r="5" />
      <circle cx="143" cy="196" r="5" />
    </g>
    <!-- Bottom DIN latch on coupler -->
    <rect x="104" y="222" width="24" height="10" rx="2" stroke-width="1.75" />

    <!-- 8 High-Density Slice I/O Modules (x=176..560, 8 x 48px wide, y=44..216) -->
    <g stroke-width="2">
      <rect x="176" y="44" width="48" height="172" rx="2" />
      <rect x="224" y="44" width="48" height="172" rx="2" />
      <rect x="272" y="44" width="48" height="172" rx="2" />
      <rect x="320" y="44" width="48" height="172" rx="2" />
      <rect x="368" y="44" width="48" height="172" rx="2" />
      <rect x="416" y="44" width="48" height="172" rx="2" />
      <rect x="464" y="44" width="48" height="172" rx="2" />
      <rect x="512" y="44" width="48" height="172" rx="2" />
    </g>

    <!-- Slice module top coding tabs, channel LEDs, and spring-clamp wiring points -->
    <g stroke-width="1.25" opacity="0.75">
      <!-- Repeat internal layout across the 8 slices -->
      <rect x="184" y="52" width="32" height="24" rx="1" />
      <rect x="232" y="52" width="32" height="24" rx="1" />
      <rect x="280" y="52" width="32" height="24" rx="1" />
      <rect x="328" y="52" width="32" height="24" rx="1" />
      <rect x="376" y="52" width="32" height="24" rx="1" />
      <rect x="424" y="52" width="32" height="24" rx="1" />
      <rect x="472" y="52" width="32" height="24" rx="1" />
      <rect x="520" y="52" width="32" height="24" rx="1" />

      <!-- Horizontal terminal rows across all 8 slices -->
      <line x1="176" y1="86" x2="560" y2="86" />
      <line x1="176" y1="106" x2="560" y2="106" />
      <line x1="176" y1="126" x2="560" y2="126" />
      <line x1="176" y1="146" x2="560" y2="146" />
      <line x1="176" y1="166" x2="560" y2="166" />
      <line x1="176" y1="186" x2="560" y2="186" />

      <!-- Terminal entry circles down each slice -->
      <circle cx="200" cy="96" r="4" /><circle cx="200" cy="116" r="4" /><circle cx="200" cy="136" r="4" /><circle cx="200" cy="156" r="4" /><circle cx="200" cy="176" r="4" /><circle cx="200" cy="198" r="4" />
      <circle cx="248" cy="96" r="4" /><circle cx="248" cy="116" r="4" /><circle cx="248" cy="136" r="4" /><circle cx="248" cy="156" r="4" /><circle cx="248" cy="176" r="4" /><circle cx="248" cy="198" r="4" />
      <circle cx="296" cy="96" r="4" /><circle cx="296" cy="116" r="4" /><circle cx="296" cy="136" r="4" /><circle cx="296" cy="156" r="4" /><circle cx="296" cy="176" r="4" /><circle cx="296" cy="198" r="4" />
      <circle cx="344" cy="96" r="4" /><circle cx="344" cy="116" r="4" /><circle cx="344" cy="136" r="4" /><circle cx="344" cy="156" r="4" /><circle cx="344" cy="176" r="4" /><circle cx="344" cy="198" r="4" />
      <circle cx="392" cy="96" r="4" /><circle cx="392" cy="116" r="4" /><circle cx="392" cy="136" r="4" /><circle cx="392" cy="156" r="4" /><circle cx="392" cy="176" r="4" /><circle cx="392" cy="198" r="4" />
      <circle cx="440" cy="96" r="4" /><circle cx="440" cy="116" r="4" /><circle cx="440" cy="136" r="4" /><circle cx="440" cy="156" r="4" /><circle cx="440" cy="176" r="4" /><circle cx="440" cy="198" r="4" />
      <circle cx="488" cy="96" r="4" /><circle cx="488" cy="116" r="4" /><circle cx="488" cy="136" r="4" /><circle cx="488" cy="156" r="4" /><circle cx="488" cy="176" r="4" /><circle cx="488" cy="198" r="4" />
      <circle cx="536" cy="96" r="4" /><circle cx="536" cy="116" r="4" /><circle cx="536" cy="136" r="4" /><circle cx="536" cy="156" r="4" /><circle cx="536" cy="176" r="4" /><circle cx="536" cy="198" r="4" />
    </g>

    <!-- Right-hand bus end-terminator cap and DIN end clamp (x=560..584) -->
    <rect x="560" y="54" width="24" height="152" rx="2" stroke-width="2.25" />
    <line x1="566" y1="112" x2="578" y2="112" stroke-width="1.5" />
    <line x1="566" y1="148" x2="578" y2="148" stroke-width="1.5" />
  </g>
</svg>
