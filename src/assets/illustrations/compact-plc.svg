<svg xmlns="http://www.w3.org/2000/svg" id="art" viewBox="0 0 640 260" role="img" aria-labelledby="title">
  <title id="title">Compact all-in-one brick PLC with top input terminals, bottom output terminals, and DIN rail mount</title>
  <g aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- 35mm DIN rail extending left and right behind the unit -->
    <line x1="44" y1="106" x2="128" y2="106" stroke-width="2" opacity="0.6" />
    <line x1="44" y1="154" x2="128" y2="154" stroke-width="2" opacity="0.6" />
    <line x1="44" y1="114" x2="128" y2="114" stroke-width="1.25" opacity="0.4" />
    <line x1="44" y1="146" x2="128" y2="146" stroke-width="1.25" opacity="0.4" />
    <line x1="512" y1="106" x2="596" y2="106" stroke-width="2" opacity="0.6" />
    <line x1="512" y1="154" x2="596" y2="154" stroke-width="2" opacity="0.6" />
    <line x1="512" y1="114" x2="596" y2="114" stroke-width="1.25" opacity="0.4" />
    <line x1="512" y1="146" x2="596" y2="146" stroke-width="1.25" opacity="0.4" />

    <!-- Main compact brick enclosure -->
    <rect x="128" y="34" width="384" height="192" rx="6" stroke-width="2.5" />
    <!-- Bottom DIN rail release clips -->
    <rect x="180" y="226" width="24" height="10" rx="2" stroke-width="1.75" />
    <rect x="436" y="226" width="24" height="10" rx="2" stroke-width="1.75" />

    <!-- Top recessed input screw terminal block (x=148..492, y=42..72) -->
    <rect x="148" y="42" width="344" height="30" rx="2" stroke-width="1.75" />
    <g stroke-width="1.5" opacity="0.8">
      <circle cx="166" cy="57" r="6" /><line x1="162" y1="57" x2="170" y2="57" />
      <circle cx="188" cy="57" r="6" /><line x1="184" y1="57" x2="192" y2="57" />
      <circle cx="210" cy="57" r="6" /><line x1="206" y1="57" x2="214" y2="57" />
      <circle cx="232" cy="57" r="6" /><line x1="228" y1="57" x2="236" y2="57" />
      <circle cx="254" cy="57" r="6" /><line x1="250" y1="57" x2="258" y2="57" />
      <circle cx="276" cy="57" r="6" /><line x1="272" y1="57" x2="280" y2="57" />
      <circle cx="298" cy="57" r="6" /><line x1="294" y1="57" x2="302" y2="57" />
      <circle cx="320" cy="57" r="6" /><line x1="316" y1="57" x2="324" y2="57" />
      <circle cx="342" cy="57" r="6" /><line x1="338" y1="57" x2="346" y2="57" />
      <circle cx="364" cy="57" r="6" /><line x1="360" y1="57" x2="368" y2="57" />
      <circle cx="386" cy="57" r="6" /><line x1="382" y1="57" x2="390" y2="57" />
      <circle cx="408" cy="57" r="6" /><line x1="404" y1="57" x2="412" y2="57" />
      <circle cx="430" cy="57" r="6" /><line x1="426" y1="57" x2="434" y2="57" />
      <circle cx="452" cy="57" r="6" /><line x1="448" y1="57" x2="456" y2="57" />
      <circle cx="474" cy="57" r="6" /><line x1="470" y1="57" x2="478" y2="57" />
    </g>

    <!-- Center molded faceplate -->
    <rect x="140" y="80" width="360" height="100" rx="4" stroke-width="2" />
    <!-- Left communication ports (mini-DIN and RS-485 terminal) -->
    <circle cx="176" cy="116" r="18" stroke-width="1.75" />
    <circle cx="176" cy="116" r="11" stroke-width="1.25" opacity="0.7" />
    <circle cx="172" cy="112" r="1.5" stroke-width="1.25" />
    <circle cx="180" cy="112" r="1.5" stroke-width="1.25" />
    <circle cx="172" cy="120" r="1.5" stroke-width="1.25" />
    <circle cx="180" cy="120" r="1.5" stroke-width="1.25" />
    <!-- Run/Stop switch and trim pots -->
    <rect x="160" y="146" width="32" height="18" rx="3" stroke-width="1.5" />
    <rect x="164" y="149" width="12" height="12" rx="1" stroke-width="1.5" />
    <circle cx="218" cy="110" r="8" stroke-width="1.5" />
    <line x1="214" y1="114" x2="222" y2="106" stroke-width="1.5" />
    <circle cx="218" cy="134" r="8" stroke-width="1.5" />
    <line x1="214" y1="130" x2="222" y2="138" stroke-width="1.5" />
