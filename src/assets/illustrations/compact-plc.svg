    <circle cx="256" cy="100" r="4" stroke-width="1.5" />
    <circle cx="256" cy="116" r="4" stroke-width="1.5" />
    <circle cx="256" cy="132" r="4" stroke-width="1.5" />
    <circle cx="256" cy="148" r="4" stroke-width="1.5" />

    <!-- Right-side I/O status LED matrix window -->
    <rect x="284" y="92" width="196" height="76" rx="3" stroke-width="1.75" />
    <line x1="284" y1="130" x2="480" y2="130" stroke-width="1.25" opacity="0.6" />
    <g stroke-width="1.5">
      <!-- Top row: Input status LEDs -->
      <rect x="298" y="102" width="10" height="14" rx="1" />
      <rect x="318" y="102" width="10" height="14" rx="1" />
      <rect x="338" y="102" width="10" height="14" rx="1" />
      <rect x="358" y="102" width="10" height="14" rx="1" />
      <rect x="378" y="102" width="10" height="14" rx="1" />
      <rect x="398" y="102" width="10" height="14" rx="1" />
      <rect x="418" y="102" width="10" height="14" rx="1" />
      <rect x="438" y="102" width="10" height="14" rx="1" />
      <rect x="458" y="102" width="10" height="14" rx="1" />
      <!-- Bottom row: Output status LEDs -->
      <rect x="298" y="142" width="10" height="14" rx="1" />
      <rect x="318" y="142" width="10" height="14" rx="1" />
      <rect x="338" y="142" width="10" height="14" rx="1" />
      <rect x="358" y="142" width="10" height="14" rx="1" />
      <rect x="378" y="142" width="10" height="14" rx="1" />
      <rect x="398" y="142" width="10" height="14" rx="1" />
      <rect x="418" y="142" width="10" height="14" rx="1" />
      <rect x="438" y="142" width="10" height="14" rx="1" />
    </g>

    <!-- Bottom recessed output screw terminal block (x=148..492, y=188..218) -->
    <rect x="148" y="188" width="344" height="30" rx="2" stroke-width="1.75" />
    <g stroke-width="1.5" opacity="0.8">
      <circle cx="166" cy="203" r="6" /><line x1="162" y1="203" x2="170" y2="203" />
      <circle cx="192" cy="203" r="6" /><line x1="188" y1="203" x2="196" y2="203" />
      <circle cx="218" cy="203" r="6" /><line x1="214" y1="203" x2="222" y2="203" />
      <circle cx="244" cy="203" r="6" /><line x1="240" y1="203" x2="248" y2="203" />
      <circle cx="270" cy="203" r="6" /><line x1="266" y1="203" x2="274" y2="203" />
      <circle cx="296" cy="203" r="6" /><line x1="292" y1="203" x2="300" y2="203" />
      <circle cx="322" cy="203" r="6" /><line x1="318" y1="203" x2="326" y2="203" />
      <circle cx="348" cy="203" r="6" /><line x1="344" y1="203" x2="352" y2="203" />
      <circle cx="374" cy="203" r="6" /><line x1="370" y1="203" x2="378" y2="203" />
      <circle cx="400" cy="203" r="6" /><line x1="396" y1="203" x2="404" y2="203" />
      <circle cx="426" cy="203" r="6" /><line x1="422" y1="203" x2="430" y2="203" />
      <circle cx="452" cy="203" r="6" /><line x1="448" y1="203" x2="456" y2="203" />
    </g>
  </g>
</svg>
