# Runs on every PR, including PRs from forks. On forks GitHub provides no secrets and a
# read-only GITHUB_TOKEN; keep it that way. Never use `pull_request_target` in this repo.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      has_lockfile: ${{ steps.lockfile.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: lockfile
        run: echo "present=$([ -f pnpm-lock.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Version comes from package.json "packageManager" (pnpm 10.34.7); setting it here too makes the action fail.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node refuses to cache without a lockfile; caching is enabled once the project exists
          cache: ${{ steps.lockfile.outputs.present == 'true' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Public-safety check (forbidden files and values)
        run: node scripts/check-public-safety.mjs
      # The steps below need the Astro project (Phase 0); they are skipped until pnpm-lock.yaml exists.
      - run: pnpm validate:content
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm lint
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm typecheck
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm test
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm build
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm audit --audit-level=high
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: Upload build
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v7
        with: { name: dist, path: dist, retention-days: 7 }
  e2e:
    needs: checks
    if: needs.checks.outputs.has_lockfile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from package.json "packageManager" (pnpm 10.34.7); setting it here too makes the action fail.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          # Adds the test pages under /e2e/ (one per tests/e2e/fixtures/*.astro), which prove islands hydrate under the Worker's CSP (ADR-0010).
          # This dist/ is only served by wrangler dev here; deploy builds never set it.
          PLCMUSEUM_E2E_FIXTURES: '1'
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
