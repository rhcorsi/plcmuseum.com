# Runs on every PR, including PRs from forks. On forks GitHub provides no secrets and a
# read-only GITHUB_TOKEN; keep it that way. Never use `pull_request_target` in this repo.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Public-safety check (forbidden files and values)
        run: node scripts/check-public-safety.mjs
      # The steps below need the Astro project (Phase 0); they are skipped until pnpm-lock.yaml exists.
      - run: pnpm validate:content
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm lint
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm typecheck
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm test
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm build
        if: hashFiles('pnpm-lock.yaml') != ''
      - run: pnpm audit --audit-level=high
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: Upload build
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 7 }
  e2e:
    needs: checks
    if: hashFiles('pnpm-lock.yaml') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
