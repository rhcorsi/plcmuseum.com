# Deploys from a protected GitHub Environment ("preview" or "production") with required reviewers.
# Secrets exist only in those environments, never at repository level. Manual until Phase 3 closes;
# afterwards add `push: { branches: [main] }` for production.
name: deploy
on:
  workflow_dispatch:
    inputs:
      env:
        description: "preview or production"
        required: true
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false
jobs:
  deploy:
    # Visible reminder only: the real control is the production environment's deployment-branch rule (main only).
    if: inputs.env != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v7
      # Version comes from package.json "packageManager" (pnpm 10.34.7); setting it here too makes the action fail.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-public-safety.mjs
      - name: Fetch approved stories from D1 (never committed; build-time only)
        run: pnpm stories:fetch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORIES_ENV: ${{ inputs.env }}
      # After stories:fetch, so the fetched story cache is validated with the exhibits.
      - run: pnpm validate:content
      - run: pnpm build
        env:
          # production publishes only "published" exhibits; preview also shows "review" ones (CONTENT_GUIDE.md 6).
          PLCMUSEUM_STAGE: ${{ inputs.env }}
          # Cleared explicitly so a workflow-level value can never publish the e2e test pages under /e2e/.
          PLCMUSEUM_E2E_FIXTURES: ''
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ inputs.env == 'production' && 'deploy' || 'deploy --env preview' }}
