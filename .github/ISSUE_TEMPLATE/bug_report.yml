name: Bug report
description: Something on the site or in the build is broken.
title: "[bug] <short description>"
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Page or command
      placeholder: "https://plcmuseum.com/pt/exhibits/ab-plc-5 or `pnpm build`"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / OS / Node version
  - type: markdown
    attributes:
      value: "Security problems: please use private vulnerability reporting (see SECURITY.md), not a public issue."
